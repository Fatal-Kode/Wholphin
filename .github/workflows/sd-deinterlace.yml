name: Wholphin release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wholphin-main-release
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref == 'refs/heads/main' && github.repository == 'Fatal-Kode/Wholphin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build release APK
        env:
          WHOLPHIN_SIGNING_BUNDLE: ${{ secrets.WHOLPHIN_SIGNING_BUNDLE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          names = ("KEY_ALIAS", "KEY_PASSWORD", "KEY_STORE_PASSWORD", "SIGNING_KEY")
          env = os.environ.copy()
          bundle = env.pop("WHOLPHIN_SIGNING_BUNDLE", "")
          if bundle:
              try:
                  values = json.loads(bundle)
                  for name in names:
                      value = values[name]
                      if not isinstance(value, str) or not value.strip() or "\n" in value or "\r" in value:
                          raise ValueError()
                      env[name] = value
                  base64.b64decode(env["SIGNING_KEY"], validate=True)
              except (KeyError, TypeError, ValueError):
                  raise SystemExit("Invalid WHOLPHIN_SIGNING_BUNDLE. Paste the complete bundle into the secret.") from None
              for name in names:
                  print("::add-mask::" + env[name], flush=True)
          if not all(env.get(name) for name in names):
              raise SystemExit("Add WHOLPHIN_SIGNING_BUNDLE to the repository's Actions secrets.")
          number = int(env["GITHUB_RUN_NUMBER"])
          subprocess.run(
              ["./gradlew", "assembleDefaultRelease", f"-PforkVersionName=1.2.{number}",
               f"-PforkVersionCode={10000 + number}"],
              env=env,
              check=True,
          )
          PY
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Wholphin-release-build
          path: app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error
      - name: Publish signed release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.2.$GITHUB_RUN_NUMBER"
          code=$((10000 + GITHUB_RUN_NUMBER))
          tag="v$version"
          mkdir release-apks
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          fingerprint() {
            "$signer" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          for apk in app/build/outputs/apk/default/release/*.apk; do
            name=${apk##*/}
            suffix=${name#Wholphin-default-release-$version-$code}
            cp "$apk" "release-apks/Wholphin-release$suffix"
            "$signer" verify "$apk"
          done
          test -f release-apks/Wholphin-release.apk
          test -f release-apks/Wholphin-release-arm64-v8a.apk
          if previous=$(gh release view --json tagName --jq .tagName); then
            mkdir previous
            gh release download "$previous" --pattern Wholphin-release.apk --dir previous
            old=$(fingerprint previous/Wholphin-release.apk)
            new=$(fingerprint release-apks/Wholphin-release.apk)
            [[ -n "$new" && "$new" == "$old" ]] || { echo "::error::Signing certificate changed"; exit 1; }
          fi
          gh release create "$tag" release-apks/*.apk --target "$GITHUB_SHA" --title "$version" --notes "Wholphin release from main at $GITHUB_SHA." --latest
