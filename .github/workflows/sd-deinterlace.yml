name: Wholphin SD deinterlace APK

on:
  push:
    branches: [sd-deinterlace]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wholphin-sd-deinterlace-release
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref == 'refs/heads/sd-deinterlace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build debug APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew assembleDefaultDebug "-PexoTestBuildNumber=$GITHUB_RUN_NUMBER" "-PexoTestCommit=${GITHUB_SHA:0:8}"
      - name: Prepare APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.0.0-$GITHUB_RUN_NUMBER-g${GITHUB_SHA:0:8}"
          mkdir release-apks
          while IFS= read -r -d '' apk; do
            name=${apk##*/}
            suffix=${name#Wholphin-default-debug-$version-$GITHUB_RUN_NUMBER}
            cp "$apk" "release-apks/Wholphin-debug$suffix"
          done < <(find app/build/outputs/apk/default/debug -name '*.apk' -print0)
          test -f release-apks/Wholphin-debug-arm64-v8a.apk
          test -f release-apks/Wholphin-debug-armeabi-v7a.apk
      - name: Upload installable test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Wholphin-Mi-Box
          path: release-apks/*.apk
          if-no-files-found: error
      - name: Publish update channel
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_STORE_PASSWORD != '' }}
        run: |
          if [[ "$HAS_SIGNING_KEY" != true ]]; then
            echo "::notice::Test APKs are available in artifacts. Configure the persistent signing secrets to publish in-place updates."
            exit 0
          fi
          tag=sd-deinterlace-updates
          version="0.0.0-$GITHUB_RUN_NUMBER-g${GITHUB_SHA:0:8}"
          notes="Wholphin Mi Box build from commit $GITHUB_SHA."
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          fingerprint() {
            "$signer" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          existing=$(gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName == \"$tag\") | .tagName")
          if [[ -n "$existing" ]]; then
            mkdir previous
            gh release download "$tag" --pattern Wholphin-debug-arm64-v8a.apk --dir previous
            old=$(fingerprint previous/Wholphin-debug-arm64-v8a.apk)
            new=$(fingerprint release-apks/Wholphin-debug-arm64-v8a.apk)
            [[ -n "$new" && "$new" == "$old" ]] || { echo "::error::Signing certificate changed"; exit 1; }
            gh release upload "$tag" release-apks/*.apk --clobber
            gh release edit "$tag" --title "$version" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" release-apks/*.apk --target "$GITHUB_SHA" --title "$version" --notes "$notes" --prerelease --latest=false
          fi
